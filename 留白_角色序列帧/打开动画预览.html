const character = document.getElementById("character");
const action = document.getElementById("action");
const frame = document.getElementById("frame");
const play = document.getElementById("play");
const position = document.getElementById("position");
const context = document.getElementById("canvas").getContext("2d");
const characters = [...new Set(clips.map(clip => clip.角色))];
let clip, images = [], timer, playing = false, ticket = 0;

function setOptions(select, items, label) {
  select.replaceChildren(...items.map(value => new Option(label(value), value)));
}

function basePath() {
  return "./" + [clip.角色, clip.序列].map(encodeURIComponent).join("/") + "/";
}

function stop() {
  playing = false;
  clearTimeout(timer);
  play.textContent = "播放";
}

function draw() {
  const i = Number(frame.value) - 1;
  context.fillStyle = "#e0e0e0";
  context.fillRect(0, 0, context.canvas.width, context.canvas.height);
  if (images[i]?.complete && images[i].naturalWidth) context.drawImage(images[i], 0, 0);
  position.value = (i + 1) + " / " + clip.帧数;
  document.getElementById("frameExport").href = basePath() + String(i + 1).padStart(2, "0") + ".png";
}

function advance() {
  frame.value = String(Number(frame.value) % clip.帧数 + 1);
  draw();
}

function schedule() {
  timer = setTimeout(() => { advance(); if (playing) schedule(); }, clip.预览逐帧毫秒[Number(frame.value) - 1]);
}

function selectClip() {
  stop();
  clip = clips.find(item => item.角色 === character.value && item.序列 === action.value);
  context.canvas.width = clip.格宽;
  context.canvas.height = clip.格高;
  frame.max = clip.帧数;
  frame.value = 1;
  const active = ++ticket;
  images = Array.from({ length:clip.帧数 }, (_,i) => {
    const im = new Image();
    im.addEventListener("load", () => { if (active === ticket && i === Number(frame.value) - 1) draw(); });
    im.src = basePath() + String(i + 1).padStart(2, "0") + ".png";
    return im;
  });
  document.getElementById("atlas").href = basePath() + encodeURIComponent("图集.png");
  const length = clip.预览逐帧毫秒.reduce((sum, ms) => sum + ms, 0);
  document.getElementById("timing").textContent = (clip.文档时长 ? "文档节拍" : "预览节拍") + " · " + length + " ms";
  document.getElementById("size").textContent = clip.格宽 + " × " + clip.格高 + " px";
  draw();
}

function selectCharacter() {
  setOptions(action, clips.filter(item => item.角色 === character.value).map(item => item.序列), value => value);
  selectClip();
}

setOptions(character, characters, value => value.slice(3));
character.addEventListener("change", selectCharacter);
action.addEventListener("change", selectClip);
frame.addEventListener("input", () => { stop(); draw(); });
document.getElementById("next").addEventListener("click", () => { stop(); advance(); });
play.addEventListener("click", () => {
  if (playing) { stop(); return; }
  playing = true;
  play.textContent = "暂停";
  schedule();
});
selectCharacter();
</script>
</html>
